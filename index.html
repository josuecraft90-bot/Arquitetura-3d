<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arquitetura 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:white;font-family:Arial}header{padding:20px 6%;border-bottom:1px solid #292929;font-weight:bold}header span,h1 span{color:#ff6a00}main{max-width:1000px;margin:auto;padding:40px 18px}.hero{text-align:center}.hero p{color:#999}.card{background:#111;border:1px solid #292929;border-radius:18px;padding:24px;margin:25px 0}.upload{display:block;text-align:center;border:2px dashed #444;border-radius:15px;padding:35px;cursor:pointer}.upload:hover{border-color:#ff6a00}input{display:none}.photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.photo{width:110px;height:85px;object-fit:cover;border-radius:9px}.box{position:relative}.x{position:absolute;right:3px;top:3px;border:0;border-radius:50%;background:#000;color:white}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}select{width:100%;padding:12px;background:#1a1a1a;color:white;border:1px solid #333;border-radius:8px;margin-top:6px}.primary{width:100%;padding:15px;margin-top:20px;background:#ff6a00;color:white;border:0;border-radius:10px;font-weight:bold}.viewer{display:none}.scene{height:420px;border:1px solid #333;border-radius:15px;background:radial-gradient(#292929,#090909);display:flex;align-items:center;justify-content:center;perspective:800px;overflow:hidden}.building{width:180px;height:230px;position:relative;transform-style:preserve-3d;animation:spin 9s linear infinite}.face{position:absolute;width:180px;height:230px;background:#d96818;border:2px solid #8b3e0b}.front{transform:translateZ(70px)}.back{transform:rotateY(180deg) translateZ(70px)}.right{width:140px;right:-70px;transform:rotateY(90deg)}.left{width:140px;left:-70px;transform:rotateY(-90deg)}.roof{position:absolute;width:195px;height:140px;top:-130px;left:-7px;background:#555;transform:rotateX(65deg)}.win{position:absolute;width:25px;height:35px;background:#9dddff;border:2px solid #333}.a{left:25px;top:45px}.b{right:25px;top:45px}.c{left:25px;top:120px}.d{right:25px;top:120px}@keyframes spin{to{transform:rotateY(335deg)}}button{cursor:pointer}.controls{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}.controls button{padding:11px;background:#222;color:white;border:1px solid #444;border-radius:8px}.note{color:#777;font-size:12px;text-align:center;margin-top:14px}@media(max-width:650px){.settings{grid-template-columns:1fr}.scene{height:350px}}
</style></head><body>
<header>ARQUITETURA <span>3D</span></header><main>
<div class="hero"><h1>Transforme fotos em <span>3D</span></h1><p>Envie suas fotos para visualizar um modelo 3D de demonstração.</p></div>
<section class="card">
<label class="upload" id="upload"><b>📷 Adicionar fotos</b><br><small>Clique aqui para escolher imagens</small><input id="files" type="file" accept="image/*" multiple></label>
<div class="photos" id="photos"></div>
<div class="settings"><label>Qualidade<select><option>Alta</option><option>Média</option><option>Baixa</option></select></label><label>Modelo<select><option>Arquitetura</option><option>Objeto</option><option>Ambiente</option></select></label><label>Textura<select><option>Detalhada</option><option>Normal</option></select></label></div>
<button class="primary" id="generate">Gerar modelo 3D</button><p class="note">Este arquivo funciona sem Three.js/CDN. A reconstrução real por IA precisa de um backend ou API de fotogrametria.</p>
</section>
<section class="card viewer" id="viewer"><h2>Modelo 3D</h2><div class="scene" id="scene"><div class="building" id="building"><div class="face front"><i class="win a"></i><i class="win b"></i><i class="win c"></i><i class="win d"></i></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="roof"></div></div></div><div class="controls"><button id="pause">⏸ Pausar</button><button id="reset">↻ Centralizar</button><button id="full">⛶ Tela cheia</button></div></section>
</main>
<script>
const input=document.getElementById('files'),photos=document.getElementById('photos'),viewer=document.getElementById('viewer'),building=document.getElementById('building');let files=[];
document.getElementById('upload').addEventListener('click',e=>{if(e.target!==input)input.click()});
input.addEventListener('change',e=>{files.push(...e.target.files);render();input.value=''});
function render(){photos.innerHTML='';files.forEach((f,i)=>{let b=document.createElement('div');b.className='box';let im=document.createElement('img');im.className='photo';im.src=URL.createObjectURL(f);let x=document.createElement('button');x.className='x';x.textContent='×';x.onclick=()=>{files.splice(i,1);render()};b.append(im,x);photos.append(b)})}
document.getElementById('generate').onclick=()=>{if(!files.length)return alert('Adicione pelo menos uma foto primeiro.');viewer.style.display='block';viewer.scrollIntoView({behavior:'smooth'})};
document.getElementById('pause').onclick=()=>building.style.animationPlayState=building.style.animationPlayState==='paused'?'running':'paused';
document.getElementById('reset').onclick=()=>{building.style.animation='none';building.offsetHeight;building.style.animation='';};
document.getElementById('full').onclick=()=>document.getElementById('scene').requestFullscreen?.();
</script></body></html>
